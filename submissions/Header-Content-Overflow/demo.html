<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bug 2 Fix - Header Content Overflow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <style>
    body { background-color: #0f172a; margin: 0; font-family: sans-serif; }
    
    /* Simulated Mobile/Tablet Header Constraints */
    .docs-header { 
      display: flex; 
      align-items: center; 
      padding: 1rem; 
      background: #1e293b; 
      width: 100%; 
      box-sizing: border-box;
    }
    
    /* THE FIX: nowrap and overflow-x applied to allow horizontal scrolling */
    .docs-header-links { 
      display: flex; 
      flex-wrap: nowrap; 
      overflow-x: auto; 
      -webkit-overflow-scrolling: touch;
      gap: 1rem; 
      align-items: center; 
      list-style: none; 
      padding: 0; 
      margin: 0 0 0 2rem;
      scrollbar-width: none; /* Hide scrollbar for Firefox */
    }
    .docs-header-links::-webkit-scrollbar { display: none; /* Hide scrollbar for Chrome/Safari */ }
    
    .docs-header-links a { color: #fff; text-decoration: none; white-space: nowrap; }
  </style>
</head>
<body>

  <header class="docs-header">
    <a href="#" class="docs-logo" style="color: #a78bfa; text-decoration: none; font-weight: bold; flex-shrink: 0;">EaseMotion</a>
    
    <ul class="docs-header-links">
      <li><a href="#getting-started">Getting Started</a></li>
      <li><a href="#utilities">Utilities</a></li>
      <li><a href="#animations">Animations</a></li>
      <li><a href="#components">Components</a></li>
      <li><a href="demo.html" style="background: #6c63ff; padding: 8px 16px; border-radius: 20px;">Live Demo →</a></li>
    </ul>
  </header>

</body>
</html>
